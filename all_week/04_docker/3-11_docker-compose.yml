services:
  app:
    build:
      context: ../02_source_code
      dockerfile: backend/Dockerfile
    container_name: 3-11_app
    environment:
      PORT: 3000
      DATABASE_URL: postgres://student:${POSTGRES_PASSWORD:-student_password}@database:5432/practice_project
    ports:
      - "8080:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: 3-11_database
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_password}
      POSTGRES_DB: practice_project
    ports:
      - "5432:5432"
    volumes:
      - ../03_database/3-11_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../03_database/3-11_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d practice_project"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  db_data:
